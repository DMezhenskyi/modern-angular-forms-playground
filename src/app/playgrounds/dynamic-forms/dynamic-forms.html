<form [formRoot]="form" class="checkout-form">
  @for (config of controlConfigs(); track config.name) {
    <div class="form-field">
      <label [for]="config.name">{{ config.label }}</label>
      @switch (config.kind) {
        @case ('text') {
          <input
            [formField]="asTextField(config.name)"
            [id]="config.name"
            [placeholder]="config.placeholder"
            [type]="config.type || 'text'"
            class="form-control"
          />
        }
        <!-- // TASK 5: extend the list of supported items in the template -->
      }
    </div>
  }

  <section class="actions">
    <button type="submit">{{ buttonText() }}</button>
  </section>
</form>
