<h1>Simple Checkout</h1>
<form [formRoot]="form" class="checkout-form">
  <df-user-info-form [form]="form.user" />

  <div class="form-field">
    <label for="itemCount">Item Count</label>
    <input [formField]="form.itemCount" id="itemCount" type="number" class="form-control" />
    @for (error of form.itemCount().errors(); track error.kind) {
      <span class="error">{{ error.message }}</span>
    }
  </div>

  <div class="form-field form-field--inline form-field--auto-height form-field--reversed">
    <label for="businessPurchase">Business Purchase</label>
    <input
      [formField]="form.businessPurchase"
      id="businessPurchase"
      type="checkbox"
      class="form-control"
    />
  </div>
  @if (!form.company().hidden()) {
    <df-company-info-form [form]="form.company" />
  }

  <section class="actions">
    <button type="submit" [disabled]="isSubmitting()">{{ buttonText() }}</button>
  </section>
</form>
